name: BFG Repo Cleaner
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download BFG
        run: curl -sL -o bfg.jar https://repo1.maven.org/maven2/com/madgag/bfg/1.14.0/bfg-1.14.0.jar

      - name: Run BFG
        run: |
          echo "re_hfax7kiw_QLCGG82UhkV3i5om2xQP92t1==>REDACTED_RESEND_API_KEY" > replacements.txt
          java -jar bfg.jar --replace-text replacements.txt
          
          # Clean reflog and force garbage collection
          git reflog expire --expire=now --all && git gc --prune=now --aggressive
          
          # Push the rewritten history
          git push --force origin main
